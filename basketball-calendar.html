<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Games Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .kids-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: #f8f9fa;
            flex-wrap: wrap;
        }

        .kid-badge {
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .kid-badge.carmen {
            background: #ff6b6b;
            color: white;
        }

        .kid-badge.marta {
            background: #4ecdc4;
            color: white;
        }

        .kid-badge.lucia {
            background: #ffd93d;
            color: #2d3436;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-bottom: 2px solid #e9ecef;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .month-nav button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }

        .month-nav button:hover {
            background: #764ba2;
        }

        .month-nav h2 {
            color: #2d3436;
            min-width: 200px;
            text-align: center;
        }

        .add-game-btn {
            background: #51cf66;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: background 0.3s;
        }

        .add-game-btn:hover {
            background: #37b24d;
        }

        .export-pdf-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: background 0.3s;
        }

        .export-pdf-btn:hover {
            background: #ee5a52;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .calendar {
            padding: 30px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .weekday {
            text-align: center;
            font-weight: bold;
            color: #667eea;
            padding: 10px;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day {
            min-height: 100px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .day:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .day.other-month {
            opacity: 0.3;
        }

        .day-number {
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 5px;
        }

        .day.today {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .game {
            font-size: 0.75em;
            padding: 4px 6px;
            border-radius: 4px;
            margin-bottom: 3px;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .game:hover {
            transform: scale(1.05);
        }

        .game.carmen {
            background: #ff6b6b;
            color: white;
        }

        .game.marta {
            background: #4ecdc4;
            color: white;
        }

        .game.lucia {
            background: #ffd93d;
            color: #2d3436;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #2d3436;
            font-size: 1.5em;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #636e72;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3436;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .form-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }

        .btn-save {
            background: #51cf66;
            color: white;
        }

        .btn-save:hover {
            background: #37b24d;
        }

        .btn-cancel {
            background: #e9ecef;
            color: #2d3436;
        }

        .btn-cancel:hover {
            background: #dee2e6;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
        }

        .btn-delete:hover {
            background: #ee5a52;
        }

        .game-details {
            margin-bottom: 15px;
        }

        .game-details p {
            margin-bottom: 10px;
            color: #2d3436;
        }

        .game-details strong {
            color: #667eea;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .header p {
                font-size: 0.95em;
            }

            .kids-info {
                flex-direction: column;
                gap: 10px;
                padding: 15px;
            }

            .kid-badge {
                width: 100%;
                justify-content: center;
            }

            .controls {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

            .month-nav {
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }

            .month-nav button {
                width: 100%;
                padding: 12px;
            }

            .month-nav h2 {
                font-size: 1.3em;
            }

            .add-game-btn {
                width: 100%;
                padding: 14px;
            }

            .export-pdf-btn {
                width: 100%;
                padding: 14px;
            }

            .button-group {
                flex-direction: column;
                width: 100%;
            }

            .calendar {
                padding: 15px;
            }

            .weekdays {
                gap: 5px;
            }

            .weekday {
                font-size: 0.85em;
                padding: 5px;
            }

            .days {
                gap: 5px;
            }

            .day {
                min-height: 80px;
                padding: 5px;
            }

            .day-number {
                font-size: 0.85em;
            }

            .game {
                font-size: 0.65em;
                padding: 3px 4px;
                margin-bottom: 2px;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
                margin: 10px;
            }

            .modal-header h3 {
                font-size: 1.2em;
            }

            .form-group label {
                font-size: 0.95em;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .form-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .form-buttons button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5em;
            }

            .header p {
                font-size: 0.9em;
            }

            .month-nav h2 {
                font-size: 1.1em;
                min-width: auto;
            }

            .day {
                min-height: 70px;
                padding: 4px;
            }

            .day-number {
                font-size: 0.8em;
                margin-bottom: 3px;
            }

            .game {
                font-size: 0.6em;
                padding: 2px 3px;
            }

            .weekday {
                font-size: 0.75em;
                padding: 4px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .container {
                max-width: 95%;
            }

            .calendar {
                padding: 25px;
            }

            .day {
                min-height: 90px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏀 Basketball Games Calendar</h1>
            <p>Track all your daughters' games in one place</p>
        </div>

        <div class="kids-info">
            <div class="kid-badge carmen">
                <span>🏀</span>
                <span>Carmen - Mini</span>
            </div>
            <div class="kid-badge marta">
                <span>🏀</span>
                <span>Marta - Infantil</span>
            </div>
            <div class="kid-badge lucia">
                <span>🏀</span>
                <span>Lucía - Cadete</span>
            </div>
        </div>

        <div class="controls">
            <div class="month-nav">
                <button id="prevMonth">← Previous</button>
                <h2 id="currentMonth">Month Year</h2>
                <button id="nextMonth">Next →</button>
            </div>
            <div class="button-group">
                <button class="add-game-btn" id="addGameBtn">+ Add Game</button>
                <button class="export-pdf-btn" id="exportPdfBtn">📄 Export to PDF</button>
            </div>
        </div>

        <div class="calendar">
            <div class="weekdays">
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
                <div class="weekday">Sun</div>
            </div>
            <div class="days" id="calendarDays"></div>
        </div>
    </div>

    <div class="modal" id="addGameModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Game</h3>
                <button class="close-btn" id="closeAddModal">&times;</button>
            </div>
            <form id="gameForm">
                <div class="form-group">
                    <label>Player</label>
                    <select id="player" required>
                        <option value="">Select a player</option>
                        <option value="carmen">Carmen (Mini)</option>
                        <option value="marta">Marta (Infantil)</option>
                        <option value="lucia">Lucía (Cadete)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="gameDate" required>
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="time" id="gameTime" required>
                </div>
                <div class="form-group">
                    <label>Opponent</label>
                    <input type="text" id="opponent" placeholder="e.g., FC Barcelona" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location" placeholder="e.g., Home Field">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" rows="3" placeholder="Any additional information..."></textarea>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn-cancel" id="cancelAdd">Cancel</button>
                    <button type="submit" class="btn-save">Save Game</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="viewGameModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Game Details</h3>
                <button class="close-btn" id="closeViewModal">&times;</button>
            </div>
            <div class="game-details" id="gameDetails"></div>
            <div class="form-buttons">
                <button type="button" class="btn-delete" id="deleteGame">Delete</button>
                <button type="button" class="btn-cancel" id="closeView">Close</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="games-data.js"></script>
    <script>
        let currentDate = new Date();
        let games = [];
        let selectedGameId = null;

        // Initialize games from gamesData or localStorage
        function initializeGames() {
            const storedGames = localStorage.getItem('kidsGames');

            if (storedGames) {
                games = JSON.parse(storedGames);
            } else if (typeof gamesData !== 'undefined') {
                games = gamesData;
                if (games.length > 0) {
                    localStorage.setItem('kidsGames', JSON.stringify(games));
                }
            } else {
                games = [];
            }

            renderCalendar();
        }

        const monthNames = ["January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"];

        const playerInfo = {
            carmen: { name: 'Carmen', category: 'Mini', class: 'carmen' },
            marta: { name: 'Marta', category: 'Infantil', class: 'marta' },
            lucia: { name: 'Lucía', category: 'Cadete', class: 'lucia' }
        };

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;

            // Get first day of month (0=Sunday, 1=Monday, ..., 6=Saturday)
            let firstDay = new Date(year, month, 1).getDay();
            // Convert to Monday-based week (Monday=0, Sunday=6)
            firstDay = (firstDay === 0) ? 6 : firstDay - 1;

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
            const todayDate = today.getDate();

            // Add days from previous month
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const dayDiv = createDayElement(day, true);
                calendarDays.appendChild(dayDiv);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dayDiv = createDayElement(day, false);
                if (isCurrentMonth && day === todayDate) {
                    dayDiv.classList.add('today');
                }

                const dayGames = games.filter(game => {
                    const gameDate = new Date(game.date);
                    return gameDate.getFullYear() === year &&
                           gameDate.getMonth() === month &&
                           gameDate.getDate() === day;
                });

                dayGames.forEach(game => {
                    const gameDiv = document.createElement('div');
                    gameDiv.className = `game ${game.player}`;
                    gameDiv.innerHTML = `
                        <div style="font-weight: bold;">${game.time} vs ${game.opponent}</div>
                        <div style="font-size: 0.9em; opacity: 0.95;">${game.location}</div>
                    `;
                    gameDiv.addEventListener('click', (e) => {
                        e.stopPropagation();
                        viewGame(game.id);
                    });
                    dayDiv.appendChild(gameDiv);
                });

                calendarDays.appendChild(dayDiv);
            }

            const totalCells = calendarDays.children.length;
            const remainingCells = 42 - totalCells;
            for (let day = 1; day <= remainingCells; day++) {
                const dayDiv = createDayElement(day, true);
                calendarDays.appendChild(dayDiv);
            }
        }

        function createDayElement(day, isOtherMonth) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day';
            if (isOtherMonth) {
                dayDiv.classList.add('other-month');
            }

            const dayNumber = document.createElement('div');
            dayNumber.className = 'day-number';
            dayNumber.textContent = day;
            dayDiv.appendChild(dayNumber);

            if (!isOtherMonth) {
                dayDiv.addEventListener('click', () => {
                    openAddGameModal(day);
                });
            }

            return dayDiv;
        }

        function openAddGameModal(day = null) {
            const modal = document.getElementById('addGameModal');
            modal.classList.add('active');

            if (day) {
                const year = currentDate.getFullYear();
                const month = String(currentDate.getMonth() + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                document.getElementById('gameDate').value = `${year}-${month}-${dayStr}`;
            } else {
                document.getElementById('gameDate').value = '';
            }

            document.getElementById('gameForm').reset();
            if (day) {
                const year = currentDate.getFullYear();
                const month = String(currentDate.getMonth() + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                document.getElementById('gameDate').value = `${year}-${month}-${dayStr}`;
            }
        }

        function closeAddGameModal() {
            document.getElementById('addGameModal').classList.remove('active');
        }

        function viewGame(gameId) {
            const game = games.find(g => g.id === gameId);
            if (!game) return;

            selectedGameId = gameId;
            const modal = document.getElementById('viewGameModal');
            const details = document.getElementById('gameDetails');

            const player = playerInfo[game.player];
            details.innerHTML = `
                <p><strong>Player:</strong> ${player.name} (${player.category})</p>
                <p><strong>Date:</strong> ${new Date(game.date).toLocaleDateString()}</p>
                <p><strong>Time:</strong> ${game.time}</p>
                <p><strong>Opponent:</strong> ${game.opponent}</p>
                ${game.location ? `<p><strong>Location:</strong> ${game.location}</p>` : ''}
                ${game.notes ? `<p><strong>Notes:</strong> ${game.notes}</p>` : ''}
            `;

            modal.classList.add('active');
        }

        function closeViewGameModal() {
            document.getElementById('viewGameModal').classList.remove('active');
            selectedGameId = null;
        }

        function deleteGame() {
            if (!selectedGameId) return;

            if (confirm('Are you sure you want to delete this game?')) {
                games = games.filter(g => g.id !== selectedGameId);
                localStorage.setItem('kidsGames', JSON.stringify(games));
                closeViewGameModal();
                renderCalendar();
            }
        }

        function exportToPdf() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthName = monthNames[month];

            // Add title
            doc.setFontSize(20);
            doc.setFont(undefined, 'bold');
            doc.text(`Basketball Games - ${monthName} ${year}`, 105, 15, { align: 'center' });

            // Get all games for this month
            const monthGames = games.filter(game => {
                const gameDate = new Date(game.date);
                return gameDate.getFullYear() === year && gameDate.getMonth() === month;
            }).sort((a, b) => {
                const dateA = new Date(a.date + ' ' + a.time);
                const dateB = new Date(b.date + ' ' + b.time);
                return dateA - dateB;
            });

            // Prepare table data
            const tableData = monthGames.map(game => {
                const gameDate = new Date(game.date);
                const dayOfWeekIndex = gameDate.getDay();
                // Convert to Monday-based week
                const dayOfWeek = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][(dayOfWeekIndex === 0) ? 6 : dayOfWeekIndex - 1];
                const day = gameDate.getDate();

                return [
                    `${dayOfWeek} ${day}`,
                    game.time,
                    playerInfo[game.player].name,
                    game.opponent,
                    game.location,
                    game.notes
                ];
            });

            // Add table
            doc.autoTable({
                startY: 25,
                head: [['Date', 'Time', 'Player', 'Opponent', 'Location', 'League']],
                body: tableData,
                theme: 'grid',
                headStyles: {
                    fillColor: [102, 126, 234],
                    fontSize: 10,
                    fontStyle: 'bold',
                    halign: 'center'
                },
                styles: {
                    fontSize: 9,
                    cellPadding: 3
                },
                columnStyles: {
                    0: { cellWidth: 25, halign: 'center' },
                    1: { cellWidth: 20, halign: 'center' },
                    2: { cellWidth: 25, halign: 'center' },
                    3: { cellWidth: 35 },
                    4: { cellWidth: 40 },
                    5: { cellWidth: 'auto' }
                },
                didParseCell: function(data) {
                    if (data.section === 'body' && data.column.index === 2) {
                        const playerName = data.cell.text[0];
                        if (playerName === 'Carmen') {
                            data.cell.styles.fillColor = [255, 107, 107];
                            data.cell.styles.textColor = [255, 255, 255];
                        } else if (playerName === 'Marta') {
                            data.cell.styles.fillColor = [78, 205, 196];
                            data.cell.styles.textColor = [255, 255, 255];
                        } else if (playerName === 'Lucía') {
                            data.cell.styles.fillColor = [255, 217, 61];
                            data.cell.styles.textColor = [45, 52, 54];
                        }
                    }
                },
                margin: { top: 25, bottom: 20, left: 10, right: 10 }
            });

            // Add footer
            const pageCount = doc.internal.getNumberOfPages();
            doc.setFontSize(8);
            doc.setFont(undefined, 'normal');
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.text(`Page ${i} of ${pageCount}`, 105, 287, { align: 'center' });
                doc.text(`Generated on ${new Date().toLocaleDateString()}`, 105, 292, { align: 'center' });
            }

            // Save the PDF
            doc.save(`Basketball-Games-${monthName}-${year}.pdf`);
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('addGameBtn').addEventListener('click', () => {
            openAddGameModal();
        });

        document.getElementById('exportPdfBtn').addEventListener('click', exportToPdf);

        document.getElementById('closeAddModal').addEventListener('click', closeAddGameModal);
        document.getElementById('cancelAdd').addEventListener('click', closeAddGameModal);

        document.getElementById('closeViewModal').addEventListener('click', closeViewGameModal);
        document.getElementById('closeView').addEventListener('click', closeViewGameModal);

        document.getElementById('deleteGame').addEventListener('click', deleteGame);

        document.getElementById('gameForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const game = {
                id: Date.now(),
                player: document.getElementById('player').value,
                date: document.getElementById('gameDate').value,
                time: document.getElementById('gameTime').value,
                opponent: document.getElementById('opponent').value,
                location: document.getElementById('location').value,
                notes: document.getElementById('notes').value
            };

            games.push(game);
            localStorage.setItem('kidsGames', JSON.stringify(games));

            closeAddGameModal();
            renderCalendar();
        });

        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });

        // Initialize the app
        initializeGames();
    </script>
</body>
</html>
